name: Cluster Boost Validation

# Manual trigger only — never scheduled.
# Runs 4 historical periods × boost on/off = 8 backtests,
# commits a markdown verdict report, and opens a PR.
#
# Branch naming: validation/cluster-boost-YYYYMMDD-<run_id>
# The run_id suffix guarantees uniqueness across multiple runs on the same day.
# --force-with-lease is used as a safety net on push.
#
# Smoke-test mode: report is uploaded as an artifact only — never committed to
# the repo.  This keeps validation history clean (only real backtest reports).
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Single period to validate (leave blank for all 4)"
        required: false
        type: choice
        options:
          - ""
          - covid_2020
          - gamestop_2021
          - tech_bear_2022
          - financial_crisis_2008
        default: ""
      force:
        description: "Force re-run (ignore cached results)"
        type: boolean
        default: false
      smoke_test:
        description: "Smoke test — synthetic data only, no API calls (report uploaded as artifact, NOT committed)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cluster boost validation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.period }}" ]; then
            ARGS="$ARGS --period ${{ inputs.period }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.smoke_test }}" = "true" ]; then
            ARGS="$ARGS --smoke-test"
          fi
          python scripts/run_cluster_validation.py $ARGS

      - name: Determine report metadata
        id: report
        run: |
          TODAY=$(date +%Y%m%d)
          # Include run_id so parallel or same-day runs never collide on the remote.
          BRANCH="validation/cluster-boost-${TODAY}-${{ github.run_id }}"
          echo "date=${TODAY}"                                       >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.run_id }}"                        >> "$GITHUB_OUTPUT"
          echo "file=backtests/cluster_boost_validation_${TODAY}.md" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"                                    >> "$GITHUB_OUTPUT"

      # ── Real-run path: commit report and open PR ──────────────────────────────
      - name: Commit report to validation branch
        if: inputs.smoke_test != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.report.outputs.branch }}"
          git add backtests/
          git diff --cached --quiet || git commit -m "validation: cluster boost report ${{ steps.report.outputs.date }} (run #${{ steps.report.outputs.run_id }})"
          # --force-with-lease guards against the remote branch already existing
          # (e.g. a workflow that wrote the branch but died before opening the PR).
          git push --force-with-lease -u origin "${{ steps.report.outputs.branch }}"

      - name: Extract verdict for PR body
        if: inputs.smoke_test != 'true'
        id: verdict
        run: |
          REPORT="${{ steps.report.outputs.file }}"
          if [ -f "$REPORT" ]; then
            VERDICT=$(grep -A1 "^## 4\. Verdict" "$REPORT" | tail -1 | sed 's/^\*\*//;s/\*\*//')
            ACTION=$(grep -A2 "^## 5\. Recommended Action" "$REPORT" | tail -1 | sed 's/^\*\*//;s/\*\*//' | cut -c1-200)
          else
            VERDICT="Report not found"
            ACTION=""
          fi
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          echo "action=${ACTION}"   >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: inputs.smoke_test != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.report.outputs.branch }}" \
            --title "validation: cluster boost — ${{ steps.report.outputs.date }} (run #${{ steps.report.outputs.run_id }})" \
            --body "$(cat <<'EOF'
          ## Cluster Boost Validation — ${{ steps.report.outputs.date }} · run #${{ steps.report.outputs.run_id }}

          **Verdict:** ${{ steps.verdict.outputs.verdict }}

          **Recommended action:** ${{ steps.verdict.outputs.action }}

          ### What this PR contains
          - `${{ steps.report.outputs.file }}` — full 8-run backtest comparison (4 periods × boost on/off)
          - Includes d+10 / d+30 hit rates, confidence-filtered rates, sector attribution, and a binary PASS/FAIL verdict

          ### How to act on the result
          - **PASS** → set `CLUSTER_BOOST_ENABLED=true` as a GitHub Actions secret / `.env` variable to activate in production
          - **FAIL** → review the "Recommended Action" section in the report before re-running

          ---
          _Triggered manually via Actions tab → "Cluster Boost Validation" → Run workflow_
          EOF
          )"

      # ── Smoke-test path: artifact only, no repo commit ────────────────────────
      - name: Upload smoke-test report as artifact (not committed to repo)
        if: inputs.smoke_test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-${{ steps.report.outputs.date }}-${{ github.run_id }}
          path: backtests/cluster_boost_validation_${{ steps.report.outputs.date }}.md
          if-no-files-found: warn
          retention-days: 7

      # ── Always: upload full results for inspection ────────────────────────────
      - name: Upload results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-validation-${{ steps.report.outputs.date }}-${{ github.run_id }}
          path: |
            backtests/cluster_boost_validation_${{ steps.report.outputs.date }}.md
            backtesting/historical/results/
          if-no-files-found: warn
          retention-days: 90
