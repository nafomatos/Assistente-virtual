name: Historical Backtest

# Manual trigger only — never scheduled. Never runs automatically.
# Does NOT modify or interact with daily_radar.yml.
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Backtest period to run"
        required: true
        type: choice
        options:
          - covid_2020
          - gamestop_2021
          - tech_bear_2022
          - financial_crisis_2008

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backtest
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python -m backtesting.historical.main --period ${{ inputs.period }}

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ inputs.period }}
          path: |
            backtesting/historical/results/${{ inputs.period }}.json
            backtesting/historical/results/${{ inputs.period }}_report.html
          if-no-files-found: warn
          retention-days: 30
