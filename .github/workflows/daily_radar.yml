name: Daily Radar

on:
  schedule:
    # 06:00 UTC daily — 08:00 Berlin (CEST) / 07:00 Berlin (CET)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Needed for the "Archive log" step to push back to the repo.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run radar
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: output/daily_report_*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Archive log to repo
        if: success()
        run: |
          if ls logs/*.txt >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logs/
            if git diff --cached --quiet; then
              echo "no new logs to commit"
            else
              TODAY="$(date -u +%Y-%m-%d)"
              git commit -m "[radar] daily log ${TODAY}"
              git push
            fi
          else
            echo "no logs/ directory produced (market likely closed today)"
          fi
