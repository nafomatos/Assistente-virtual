name: Daily Radar

on:
  schedule:
    # 20:00 UTC Mon-Fri — 22:00 Berlin (CEST) / 21:00 Berlin (CET), after US markets close at 16:00 ET
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Run in debug mode (all 18 tickers, no email, no log commit)"
        type: boolean
        default: false
      force:
        description: "Force run — bypasses market calendar. On weekends sends the weekly summary only."
        type: boolean
        default: false

# Needed for the "Archive log" step to push back to the repo.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run radar
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLUSTER_BOOST_ENABLED: ${{ vars.CLUSTER_BOOST_ENABLED }}
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python main.py --debug 2>&1 | tee debug_output.txt
          elif [ "${{ inputs.force }}" = "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: Upload debug output artifact
        if: ${{ inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug_output.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload report artifact
        if: ${{ inputs.debug != true }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: output/daily_report_*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Archive log to repo
        if: ${{ inputs.debug != true && success() }}
        run: |
          if ls logs/*.txt >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logs/
            if git diff --cached --quiet; then
              echo "no new logs to commit"
            else
              TODAY="$(date -u +%Y-%m-%d)"
              git commit -m "[radar] daily log ${TODAY}"
              git push
            fi
          else
            echo "no logs/ directory produced (market likely closed today)"
          fi
